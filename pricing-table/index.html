<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Plans - Plan comparison</title>
  </head>
  <body>
    <header>
      <h1>Acme Plans</h1>
      <nav aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <h2>Plan comparison</h2>

      <table>
        <caption>
          Comparison of the Free, Pro and Business subscription plans
        </caption>

        <thead>
          <tr>
            <th scope="col">Plan</th>
            <th scope="col">Storage</th>
            <th scope="col">Projects</th>
            <th scope="col">Support</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <th scope="row">Free</th>
            <td>5 GB</td>
            <td>3</td>
            <td>Email</td>
          </tr>
          <tr>
            <th scope="row">Pro</th>
            <td>100 GB</td>
            <td>25</td>
            <td>Priority Email</td>
          </tr>
          <tr>
            <th scope="row">Business</th>
            <td>1 TB</td>
            <td>Unlimited</td>
            <td>24/7 Phone</td>
          </tr>
        </tbody>

        <tfoot>
          <tr>
            <td colspan="4">All plans include SSL and daily backups</td>
          </tr>
        </tfoot>
      </table>
    </main>

    <footer>
      <p>&copy; 2025 MySite</p>
    </footer>
  </body>
</html>
