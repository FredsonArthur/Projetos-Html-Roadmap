<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us - Acme Support</title>
  </head>
  <body>
    <header>
      <p>Acme Support</p>
      <nav aria-label="Primary">
        <a href="#">Home</a>
        <a href="#">Help</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <h1>Contact us</h1>
      <p>Send us a message and we will get back to you.</p>

      <form action="https://example.com/contact" method="post">
        <p>
          <label for="full-name">Full name</label>
          <input
            type="text"
            id="full-name"
            name="full_name"
            autocomplete="name"
            required
          />
        </p>

        <p>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </p>

        <p>
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="">Choose a topic</option>
            <option value="billing">Billing</option>
            <option value="technical">Technical support</option>
            <option value="feedback">Feedback</option>
            <option value="other">Other</option>
          </select>
        </p>

        <p>
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="8"
            cols="40"
            minlength="10"
            required
          ></textarea>
        </p>

        <fieldset>
          <legend>How did you hear about us?</legend>

          <p>
            <input type="radio" id="source-search" name="source" value="search" />
            <label for="source-search">Search</label>
          </p>
          <p>
            <input type="radio" id="source-friend" name="source" value="friend" />
            <label for="source-friend">Friend</label>
          </p>
          <p>
            <input type="radio" id="source-social" name="source" value="social" />
            <label for="source-social">Social media</label>
          </p>
        </fieldset>

        <p>
          <input type="checkbox" id="newsletter" name="newsletter" value="yes" />
          <label for="newsletter">Send me product updates</label>
        </p>

        <button type="submit">Send message</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Acme Support</p>
    </footer>
  </body>
</html>
