<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fredson Arthur - Contact</title>
    <meta name="description" content="Página de contato do portfólio de Fredson Arthur. Entre em contato preenchendo o formulário.">
</head>
<body>

    <!-- Cabeçalho e Navegação Global -->
    <header>
        <div>
            <span>[F]</span> <strong>Fredson Arthur</strong>
        </div>
        <nav>
            <a href="index.html">Home</a> / 
            <a href="projects.html">Projects</a> / 
            <a href="articles.html">Articles</a> / 
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <hr>

    <!-- Conteúdo Principal -->
    <main>
        <section>
            <h1>Contact Me</h1>
            <p>If you want to get in touch, discuss a project, or talk about technology, please fill out the form below:</p>
        </section>

        <hr>

        <!-- Formulário de Contato -->
        <section>
            <form action="#" method="POST">
                <div>
                    <label for="name">Your Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <br>

                <div>
                    <label for="email">Your Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <br>

                <div>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                
                <br>

                <div>
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </section>
    </main>

    <hr>

    <!-- Rodapé -->
    <footer>
        <p>&copy; all rights reserved 2026</p>
    </footer>

</body>
</html>
