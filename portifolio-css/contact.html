<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fredson Arthur - Contact</title>
    <meta name="description" content="Página de contato estilizada com CSS do portfólio de Fredson Arthur.">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para o formulário de contato */
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            background: var(--bg-color);
            color: var(--text-color);
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        button[type="submit"] {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho e Navegação Global -->
    <header>
        <div class="logo-area">
            <div class="logo-box">F</div>
            <strong>Fredson Arthur</strong>
        </div>
        <nav>
            <a href="index.html">Home</a> / 
            <a href="projects.html">Projects</a> / 
            <a href="articles.html">Articles</a> / 
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main>
        <section class="hero">
            <h1>Contact Me</h1>
            <p>If you want to get in touch, discuss a project, or talk about technology, please fill out the form below:</p>
        </section>

        <!-- Seção do Formulário -->
        <section>
            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                
                <div class="form-group">
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; all rights reserved 2026</p>
    </footer>

</body>
</html>
