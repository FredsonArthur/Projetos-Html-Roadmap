<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Temperature Converter</h1>
      <p class="subtitle">Enter the temperature, select units and submit</p>

      <form id="converter-form" class="converter-form">
        <input
          type="number"
          id="temperature-input"
          placeholder="0.00"
          step="any"
          required
        />

        <select id="from-unit" required>
          <option value="" selected disabled>From Unit</option>
          <option value="celsius">Celsius</option>
          <option value="fahrenheit">Fahrenheit</option>
          <option value="kelvin">Kelvin</option>
        </select>

        <select id="to-unit" required>
          <option value="" selected disabled>To Unit</option>
          <option value="celsius">Celsius</option>
          <option value="fahrenheit">Fahrenheit</option>
          <option value="kelvin">Kelvin</option>
        </select>

        <button type="submit" id="convert-btn" disabled>Convert</button>
      </form>

      <p class="result" id="result"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
