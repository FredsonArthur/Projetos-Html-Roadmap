<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Layout</title>
    <meta name="description" content="Layout de galeria assimétrica estruturado com CSS Grid e placeholders visuais.">
    <!-- Ligação à folha de estilos do projeto -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="gallery-container">
        <div class="image-grid">
            
            <!-- Item 1: Foggy beach (Vertical Esquerda) -->
            <div class="grid-item item-1">
                <span class="placeholder-text">A foggy beach with a large rock formation</span>
            </div>

            <!-- Item 2: Food table (Topo Centro) -->
            <div class="grid-item item-2">
                <span class="placeholder-text">A table topped with plates and bowls of food</span>
            </div>

            <!-- Item 3: Living room (Baixo Esquerda) -->
            <div class="grid-item item-3">
                <span class="placeholder-text">A living room with a white couch</span>
            </div>

            <!-- Item 4: Building with red door (Centro Vertical) -->
            <div class="grid-item item-4">
                <span class="placeholder-text">A building with a red door and a tree</span>
            </div>

            <!-- Item 5: Apartment buildings (Topo Direita) -->
            <div class="grid-item item-5">
                <span class="placeholder-text">A row of white apartment buildings</span>
            </div>

            <!-- Item 6: Beach from hill (Baixo Direita) -->
            <div class="grid-item item-6">
                <span class="placeholder-text">A view of a beach from a hill</span>
            </div>

        </div>
    </main>

</body>
</html>
