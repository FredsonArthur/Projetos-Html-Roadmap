<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Consent Banner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1>Cookie Consent Banner</h1>
    <p>Navegue pela página. O popup de cookies aparece no canto inferior direito.</p>
  </main>

  <div class="cookie-banner" id="cookie-banner">
    <button class="close-btn" id="close-btn" aria-label="Fechar">&times;</button>
    <div class="cookie-icon">🍪</div>
    <p class="cookie-message">We use cookies to improve your user experience.</p>
    <button class="accept-btn" id="accept-btn">I like Cookies</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
