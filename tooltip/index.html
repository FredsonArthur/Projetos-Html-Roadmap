<!DOCTYPE html>
<html lang="pt-PT">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Only Tooltip</title>

    <!-- Ligação à folha de estilos do projeto -->
    <link rel="stylesheet" href="style.css">

    <main class="tooltip-container">
